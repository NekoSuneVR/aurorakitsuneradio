plugins { id 'java' }
group = 'ca.fumikoecho.auroraradio'
version = '0.1.0'
repositories { maven { url = uri('https://repo.mats.coffee/repository/mats-public') }; mavenCentral(); maven { url = uri('https://repo.papermc.io/repository/maven-public/') } }
